<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Eleven Forward · Design studio</title><link rel="stylesheet" href="/shared/styles.css"><style>body{background:#eceee7}main{max-width:1600px;margin:auto;padding:70px 4vw}h1{max-width:900px;margin:20px 0}p{line-height:1.6}.designs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin-top:55px}.designs article{background:white;padding:20px}.designs img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:#ddd}.designs h2{font-size:30px}.designs article:first-child{grid-column:1/-1}.designs article:first-child img{aspect-ratio:21/8}@media(max-width:650px){.designs{grid-template-columns:1fr}.designs article:first-child{grid-column:auto}.designs article:first-child img{aspect-ratio:16/10}}</style><main><p>ELEVEN FORWARD / DESIGN EXPLORATION</p><h1>One movement.<br>Five ways forward.</h1><p>Explore complete storefront directions. Choose a design, browse the collection, and compare the same shopping journey.</p><p>Local review · Preview prices · No orders or subscriptions</p><div class="designs" id="designs"></div></main><script>const descriptions={native:'The current Eleven Forward experience. The baseline for every comparison.',on:'Precise, product-led design. Technical clarity and generous white space.',lulu:'Warm retail discovery. Approachable collections and clear product choices.',nike:'Bold campaign storytelling. Large imagery and confident typography.',vuori:'Quiet editorial storytelling. A personal journey, with room to breathe.'};document.querySelector('#designs').innerHTML=Object.entries(descriptions).map(([id,description],i)=>`<article><a href="/designs/${id}/"><img src="/screenshots/${id}-desktop.png" alt="${id} homepage preview"></a><p>0${i+1} / WEBSITE DIRECTION</p><h2>${id==='lulu'?'Lulu':id[0].toUpperCase()+id.slice(1)}</h2><p>${description}</p><a class="button" href="/designs/${id}/">Explore design →</a></article>`).join('');</script></html>
